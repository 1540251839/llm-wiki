[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "researchwiki"
version = "0.4.0"
description = "A local, provenance-aware research knowledge wiki"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115",
  "pymupdf>=1.23",
  "pydantic>=2.0",
  "python-multipart>=0.0.9",
  "typer>=0.9",
  "uvicorn>=0.30",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["openai>=1.0"]
dev = ["httpx>=0.27", "pytest>=7.0"]

[project.scripts]
rw = "researchwiki.cli:main"

[tool.setuptools.packages.find]
include = ["researchwiki*"]

[tool.setuptools.package-data]
"researchwiki.web" = ["static/*"]
