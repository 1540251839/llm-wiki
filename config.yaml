llm:
  provider: deepseek
  model: deepseek-flash
  base_url: https://api.deepseek.com
  timeout_seconds: 180
  max_retries: 1

wiki:
  root: ./wiki
  language: zh-CN  # 中文解释优先；英文标题、摘要及证据始终保留

database:
  path: ./data/researchwiki.db

retrieval:
  top_k: 8
  max_context_chars: 48000
  response_reserve_chars: 6000
  max_page_chars: 9000
  graph_expansion: true
  vector:
    enabled: false
    provider: openai
    model: text-embedding-3-small
    base_url: https://api.openai.com/v1
    timeout_seconds: 60

ingestion:
  quality_mode: basic
  max_attempts: 3

parser:
  backend: pymupdf
  grobid_url: ""  # 可选本地 GROBID: http://127.0.0.1:8070
